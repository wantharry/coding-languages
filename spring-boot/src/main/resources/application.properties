# ----------------------------------------------------------------------------------
# EXTERNALIZED CONFIGURATION
# ----------------------------------------------------------------------------------
# This file is Spring Boot's default mechanism for keeping configuration OUT of
# compiled code. Spring Boot auto-loads it from the classpath at startup and binds
# its key=value pairs into the Environment, which @Value("${...}") fields and
# @ConfigurationProperties classes can then read. The same keys can be overridden
# per-deployment without touching this file or recompiling anything - via an OS
# environment variable (SPRING_APPLICATION_NAME), a -D system property
# (-Dspring.application.name=...), or a command-line arg (--spring.application.name=...).
# Spring Boot resolves all of these sources with a documented precedence order
# (command-line args win over this file), which is exactly what lets the same build
# artifact run with different settings in dev/test/prod.

spring.application.name=spring-boot-demo

# ----------------------------------------------------------------------------------
# DATASOURCE - H2 in-memory database
# ----------------------------------------------------------------------------------
# Because spring-boot-starter-data-jpa + the H2 driver are both on the classpath,
# DataSourceAutoConfiguration would actually build a working in-memory H2 DataSource
# with zero properties at all. We set these explicitly anyway so the JDBC URL and
# console path are predictable and documented for anyone reading this file, rather
# than relying on Boot's randomly-suffixed default URL.
spring.datasource.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Expose the H2 web console at /h2-console for manually inspecting the in-memory
# database while the app is running (handy for debugging during development; never
# enable this in a real production profile).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----------------------------------------------------------------------------------
# JPA / HIBERNATE
# ----------------------------------------------------------------------------------
# ddl-auto=create-drop: Hibernate generates the schema from our @Entity classes at
# startup and drops it at shutdown. Perfect for an in-memory demo/test database with
# no persistent state to preserve; in a real production app this would instead be
# "validate" or "none", with schema changes managed by a migration tool (Flyway /
# Liquibase) instead of letting Hibernate touch the schema automatically.
spring.jpa.hibernate.ddl-auto=create-drop

# Log the actual generated SQL to the console - genuinely useful for understanding
# what Hibernate/the derived query methods are doing under the hood, and for
# noticing N+1 query problems during development.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicit dialect isn't strictly required (Boot auto-detects it from the driver),
# but spelling it out here is a useful anchor for anyone reading this file.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ----------------------------------------------------------------------------------
# SERVER
# ----------------------------------------------------------------------------------
# The embedded Tomcat's port. Change this (or override with --server.port=9090 etc.)
# if 8080 is already taken on a given machine - no code change required.
server.port=8080
